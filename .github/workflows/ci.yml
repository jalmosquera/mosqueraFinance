name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run pytest

  frontend:
    name: Frontend checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test -- --run
      - run: npm run e2e

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    env:
      DJANGO_ALLOWED_HOSTS: ci.example.test
      DJANGO_SECRET_KEY: ci-not-a-production-secret
      POSTGRES_DB: mosquera_finance_ci
      POSTGRES_PASSWORD: ci-not-a-production-password
      POSTGRES_USER: mosquera_finance_ci
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
